<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Elite-Line Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .logo-text span {
            color: #00ff88;
        }

        .logo-sub {
            font-size: 10px;
            letter-spacing: 5px;
            color: #666;
            display: block;
            margin-top: 5px;
        }

        /* Card */
        .card {
            background: #111;
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            padding: 40px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            transition: border-color 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #00ff88;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 15px;
            background: #00ff88;
            color: #0a0a0a;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        /* Messages */
        .error-msg {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.3);
            color: #ff5555;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .success-msg {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        /* Footer */
        .card-footer {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .card-footer a {
            color: #00ff88;
            text-decoration: none;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        /* Forgot Password */
        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #666;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #00ff88;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #0a0a0a;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Back link */
        .back-link {
            text-align: center;
            margin-bottom: 30px;
        }

        .back-link a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #00ff88;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider-text {
            color: #444;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Support link */
        .support-link {
            text-align: center;
            margin-top: 20px;
        }

        .support-link a {
            color: #666;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s ease;
        }

        .support-link a:hover {
            color: #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Logo -->
        <div class="logo">
            <div class="logo-text">ELITE<span>LINE</span></div>
            <span class="logo-sub">TERMINAL</span>
        </div>

        <!-- Back Link -->
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>

        <!-- Login Card -->
        <div class="card">
            <h2 class="card-title">Welcome Back</h2>
            <p class="card-subtitle">Sign in to your Elite-Line Terminal account</p>

            <!-- Messages -->
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>

            <!-- Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">
                    <label>EMAIL ADDRESS</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>PASSWORD</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <!-- Forgot Password -->
                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn" id="submitBtn">
                    SIGN IN
                </button>

            </form>

            <!-- Divider -->
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">OR</span>
                <div class="divider-line"></div>
            </div>

            <!-- Footer -->
            <div class="card-footer">
                Don't have an account? 
                <a href="register.html">Create Account</a>
            </div>

            <!-- Support Link -->
            <div class="support-link">
                <a href="https://t.me/SIPCONNECT0">
                    Need help? Contact Support →
                </a>
            </div>
        </div>

    </div>

    <script>
        // Check if already logged in
        const token = localStorage.getItem('token')
        if (token) {
            window.location.href = 'dashboard.html'
        }

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault()

            // Get values
            const email = document.getElementById('email').value.trim()
            const password = document.getElementById('password').value

            // Hide messages
            document.getElementById('errorMsg').style.display = 'none'
            document.getElementById('successMsg').style.display = 'none'

            // Show loading
            const btn = document.getElementById('submitBtn')
            btn.disabled = true
            btn.innerHTML = '<span class="spinner"></span> Signing In...'

            try {
                // Send request to backend
                const response = await fetch('https://elite-line-backend.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                })

                const data = await response.json()

                if (response.ok) {
                    // Save token and user data
                    localStorage.setItem('token', data.token)
                    localStorage.setItem('user', JSON.stringify(data.user))

                    // Show success
                    showSuccess('Login successful! Redirecting...')

                    // Redirect based on role
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = 'admin.html'
                        } else {
                            window.location.href = 'dashboard.html'
                        }
                    }, 1500)

                } else {
                    showError(data.error || 'Login failed')
                    btn.disabled = false
                    btn.innerHTML = 'SIGN IN'
                }

            } catch (error) {
                showError('Cannot connect to server. Please try again.')
                btn.disabled = false
                btn.innerHTML = 'SIGN IN'
            }
        })

        // Show error message
        function showError(message) {
            const errorMsg = document.getElementById('errorMsg')
            errorMsg.textContent = message
            errorMsg.style.display = 'block'
        }

        // Show success message
        function showSuccess(message) {
            const successMsg = document.getElementById('successMsg')
            successMsg.textContent = message
            successMsg.style.display = 'block'
        }
    </script>

</body>
</html>
